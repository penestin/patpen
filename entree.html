<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PATPEN - Contribution patrimoniale</title>

<style>

:root{
    --vert:#2c7a3f;
    --vertclair:#eaf6ec;
    --gris:#f5f7f9;
    --texte:#333;
    --ombre:0 4px 18px rgba(0,0,0,.12);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#eef2f4;
    color:var(--texte);
    padding:20px;
}

.conteneur{
    max-width:1000px;
    margin:auto;
}

.entete{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:var(--ombre);
    text-align:center;
    margin-bottom:20px;
}

.entete h1{
    color:var(--vert);
}

.contributeur{
    background:var(--vertclair);
    border-left:5px solid var(--vert);
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
}

.formulaire{
    background:white;
    border-radius:12px;
    padding:30px;
    box-shadow:var(--ombre);
}

.section{
    margin-bottom:30px;
}

.section h2{
    color:var(--vert);
    margin-bottom:15px;
}

.form-group{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:600;
    margin-bottom:5px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

textarea{
    resize:vertical;
}

.boutons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:30px;
}

.btn{
    padding:12px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.btn-principal{
    background:var(--vert);
    color:white;
}

.btn-secondaire{
    background:#ddd;
}

.apercu{
    display:none;
    background:white;
    margin-top:20px;
    padding:25px;
    border-radius:12px;
    box-shadow:var(--ombre);
}

hr{
    margin:15px 0;
}

@media(max-width:768px){

    .boutons{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

</style>

</head>

<body>

<div class="conteneur">

<div class="entete">

<h1>🏛️ PATPEN</h1>

<p>
Patrimoine & Mémoire de Pénestin
</p>

</div>

<div class="contributeur">

<strong>Contributeur identifié :</strong>

<span id="nomContributeur"></span>

</div>

<div class="formulaire">

<div class="section">

<h2>📍 Localisation</h2>

<div class="form-group">
<label>Nom de l'élément patrimonial *</label>
<input type="text" id="nomPatrimoine">
</div>

<div class="form-group">
<label>Lieu-dit ou adresse</label>
<input type="text" id="adresse">
</div>

<div class="form-group">
<label>Latitude</label>
<input type="text" id="latitude">
</div>

<div class="form-group">
<label>Longitude</label>
<input type="text" id="longitude">
</div>

</div>

<div class="section">

<h2>🏛️ Désignation</h2>

<div class="form-group">

<label>Catégorie *</label>

<select id="categorie">

<option value="">Sélectionner</option>

<option>Puits</option>
<option>Fontaine</option>
<option>Lavoir</option>
<option>Four à pain</option>
<option>Croix</option>
<option>Calvaire</option>
<option>Chapelle</option>
<option>Moulin</option>
<option>Arbre remarquable</option>
<option>Patrimoine maritime</option>
<option>Sentier</option>
<option>Maison remarquable</option>
<option>Autre</option>

</select>

</div>

<div class="form-group">

<label>Etat de conservation</label>

<select id="etat">

<option>Très bon</option>
<option>Bon</option>
<option>Moyen</option>
<option>Mauvais</option>
<option>Disparu</option>

</select>

</div>

</div>

<div class="section">

<h2>📸 Illustrations</h2>

<div class="form-group">

<label>Photographies</label>

<input
type="file"
id="photos"
multiple
accept="image/*">

</div>

</div>

<div class="section">

<h2>📝 Description</h2>

<div class="form-group">

<label>Description *</label>

<textarea
id="description"
rows="6"></textarea>

</div>

</div>

<div class="section">

<h2>📚 Historique</h2>

<div class="form-group">

<label>Historique connu</label>

<textarea
id="historique"
rows="5"></textarea>

</div>

</div>

<div class="section">

<h2>🔎 Observations</h2>

<div class="form-group">

<label>Informations complémentaires</label>

<textarea
id="observations"
rows="4"></textarea>

</div>

</div>

<div class="boutons">

<button
class="btn btn-principal"
onclick="afficherApercu()">

Vérifier avant envoi

</button>

<button
class="btn btn-secondaire"
onclick="location.href='identification.html'">

Modifier mes coordonnées

</button>

</div>

</div>

<div id="apercu" class="apercu">

<h2>✅ Vérification</h2>

<div id="contenuApercu"></div>

<br>

<button
class="btn btn-principal"
onclick="envoyerContribution()">

Envoyer la contribution

</button>

</div>

</div>

<script>

function verifierIdentification(){

    const nom =
    localStorage.getItem("patpen_nom");

    const prenom =
    localStorage.getItem("patpen_prenom");

    const email =
    localStorage.getItem("patpen_email");

    if(!nom || !prenom || !email){

        alert(
        "Veuillez vous identifier avant de contribuer."
        );

        window.location.href =
        "identification.html";

        return;
    }

    document.getElementById(
        "nomContributeur"
    ).innerHTML =

    prenom + " " + nom +
    " (" + email + ")";
}


function afficherApercu(){

    const categorie =
    document.getElementById("categorie").value;

    document.getElementById("nomPatrimoine").value;

    const description =

    if(!categorie){

        alert("Choisissez une catégorie.");
        return;
    }

    if(!nomPatrimoine){

        alert("Indiquez un nom.");
        return;
    }

    if(!description){

        alert("Complétez la description.");
        return;
    }

    document.getElementById(
        "contenuApercu"
    ).innerHTML =

    `
    <p><strong>Nom :</strong> ${nomPatrimoine}</p>

    <p><strong>Catégorie :</strong> ${categorie}</p>

    <p><strong>Adresse :</strong>
    ${document.getElementById("adresse").value}</p>

    <p><strong>Latitude :</strong>
    ${document.getElementById("latitude").value}</p>

    <p><strong>Longitude :</strong>
    ${document.getElementById("longitude").value}</p>

    <p><strong>Etat :</strong>
    ${document.getElementById("etat").value}</p>

    <hr>

    <p><strong>Description :</strong></p>

    <p>${description}</p>

    <hr>

    <p><strong>Historique :</strong></p>

    <p>${document.getElementById("historique").value}</p>

    <hr>

    <p><strong>Observations :</strong></p>

    <p>${document.getElementById("observations").value}</p>
    `;

    document.getElementById(
        "apercu"
    ).style.display = "block";

    window.scrollTo({
        top:document.body.scrollHeight,
        behavior:"smooth"
    });
}
