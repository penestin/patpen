<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PATPEN - Carte du patrimoine</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{
    --patpen:#9c4b84;
}

html,body{
    height:100%;
    margin:0;
    font-family:Segoe UI,sans-serif;
}

#map{
    height:100%;
}

.titre{
    position:absolute;
    top:15px;
    left:15px;
    z-index:1000;
    background:white;
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
    color:var(--patpen);
    box-shadow:0 2px 10px rgba(0,0,0,.2);
}

</style>
</head>

<body>

<div class="titre">
PATPEN - Inventaire participatif
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const map = L.map('map').setView([47.483,-2.48],13);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}).addTo(map);

fetch('patrimoine.json')
.then(r=>r.json())
.then(data=>{

data.forEach(item=>{

L.marker([
item.latitude,
item.longitude
])
.addTo(map)
.bindPopup(`
<b>${item.nom}</b><br>
${item.categorie}<br><br>
<a href="fiche.html?id=${item.id}">
Voir la fiche
</a>
`);

});

});

</script>

</body>
</html>
