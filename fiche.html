<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fiche Patrimoine</title>

<style>
:root{
    --violet:#9c4b84;
    --violet-clair:#eadde7;
    --gris:#f5f5f5;
    --texte:#333;
    --bordure:#ddd;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#fff;
    color:var(--texte);
    max-width:900px;
    margin:auto;
}

.header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:25px;
    border-bottom:1px solid var(--bordure);
}

.close{
    font-size:38px;
    color:var(--violet);
    cursor:pointer;
}

h1{
    color:var(--violet);
    font-size:42px;
}

.galerie{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:10px;
    padding:20px;
}

.galerie img{
    width:100%;
    height:380px;
    object-fit:cover;
    border-radius:20px;
}

.adresse{
    margin:0 20px 20px;
    background:var(--violet-clair);
    padding:25px;
    border-radius:18px;
    line-height:1.5;
}

.section{
    padding:20px;
    border-top:1px solid var(--bordure);
}

.section h3{
    color:#666;
    font-size:15px;
    margin-bottom:10px;
    font-weight:bold;
}

.section p{
    font-size:28px;
    line-height:1.4;
}

.meta{
    background:#f3edf2;
    padding:25px;
    margin-top:20px;
}

.meta p{
    margin-bottom:10px;
}

.bloc-validation{
    font-size:15px;
    font-weight:bold;
    margin-top:15px;
}

.bouton{
    background:#ede5ed;
    color:var(--violet);
    padding:25px;
    font-size:22px;
    font-weight:bold;
    text-decoration:none;
    display:block;
    margin-top:10px;
}

@media(max-width:700px){

.galerie{
    grid-template-columns:1fr;
}

.galerie img{
    height:250px;
}

h1{
    font-size:32px;
}

.section p{
    font-size:22px;
}
}
</style>
</head>

<body>

<div class="header">
    <div class="close">✕</div>
    <h1>{{nom}}</h1>
</div>

<div class="galerie">
    <img src="{{photos}}" alt="{{legende}}">
    <img src="{{photos2}}" alt="{{legende}}">
</div>

<div class="adresse">
    {{adresse}}<br>
    {{commune}}
</div>

<div class="section">
    <h3>Catégorie</h3>
    <p>{{categorie}}</p>
</div>

<div class="section">
    <h3>Description</h3>
    <p>{{description}}</p>
</div>

<div class="section">
    <h3>Propriétaire</h3>
    <p>{{proprietaire}}</p>
</div>

<div class="section">
    <h3>Accès</h3>
    <p>{{acces}}</p>
</div>

<div class="section">
    <h3>Matériaux</h3>
    <p>{{materiaux}}</p>
</div>

<div class="section">
    <h3>Période</h3>
    <p>{{periode}}</p>
</div>

<div class="section">
    <h3>Historique</h3>
    <p>{{historique}}</p>
</div>

<div class="section">
    <h3>Commentaires
