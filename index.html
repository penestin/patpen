<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body, #map {
    margin: 0;
    width: 100%;
    height: 100%;
}
</style>

</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/script>

<script>

// création de la carte
const map = L.map('map').setView(
    [47.482, -2.475],
    13
);

// fond OpenStreetMap
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

// marqueur de test
L.marker(
    [47.482, -2.475]
)
.addTo(map)
.bindPopup(
    'PATPEN - Pénestin'
);

</script>

</body>
</html>
