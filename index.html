<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8">

<title>PATPEN</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">

<style>
html,
body,
#map {
    height: 100%;
    margin: 0;
}
</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script

var map = L.map('map');

map.setView(
    [47.482, -2.475],
    13
);

var fond = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '© OpenStreetMap'
    }
);

fond.addTo(map);

var marqueur = L.marker(
    [47.482, -2.475]
);

marqueur.addTo(map);

</script>

</body>
</html>
