<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// création de la carte
const map = L.map('map').setView(
    [47.482, -2.475],
    13
);

// fond OpenStreetMap
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

// marqueur de test
L.marker(
    [47.482, -2.475]
)
.addTo(map)
.bindPopup(
    'PATPEN - Pénestin'
);

</script>
