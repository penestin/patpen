<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
html, body {
margin: 0;
height: 100%;
}
body {
display: flex;
}
#sidebar {
width: 300px;
background: #f5f5f5;
padding: 15px;
border-right: 1px solid #ddd;
font-family: Arial, sans-serif;
}
#map {
flex: 1;
height: 100vh;
}
input,
select {
width: 100%;
margin-bottom: 10px;
padding: 5px;
}
</style>

</head>
<body>

<div id="sidebar">

<h2>PATPEN</h2>

<label>Recherche</label>
<input type="text">

<label>Catégorie</label>

<select>
<option>Toutes</option>
<option>Puits</option>
<option>Lavoir</option>
<option>Fontaine</option>
<option>Croix</option>
<option>Four à pain</option>
</select>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// création de la carte
const map = L.map('map').setView(
    [47.482, -2.475],
    13
);

// fond OpenStreetMap
L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
    }
).addTo(map);

// marqueur de test
L.marker(
    [47.482, -2.475]
)
.addTo(map)
.bindPopup(
    'PATPEN - Pénestin'
);

</script>

<body>
<div id="sidebar">
<h2>PATPEN</h2>
<label>Recherche</label>
<input id="search">
<label>Catégorie</label>
<select id="categorie">
<option>Toutes</option>
<option>Puits</option>
<option>Lavoir</option>
<option>Fontaine</option>
<option>Croix</option>
<option>Four à pain</option>
</select>
</div>
<div id="map"></div>
</body>
</html>
