<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN - Carte</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    height:100%;
}

#map{
    width:100%;
    height:100vh;
}

</style>

</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const ap = L.map('map').setView(
    [47.482,-2.475],
    13
);

L.tileLayer(
    'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution:'© OpenStreetMap'
    }
).addTo(map);

L.marker(
    [47.482,-2.475]
)
.addTo(map)
.bindPopup(
    '<b>PATPEN</b><br>Patrimoine & Mémoire de Pénestin'
);

</script>

</body>
</html>
