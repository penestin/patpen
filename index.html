<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN - Patrimoine & Mémoire de Pénestin</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

html,
body{
    margin:0;
    height:100%;
}

body{
    display:flex;
}

#sidebar{
    width:300px;
    min-width:300px;
    background:#f5f5f5;
    border-right:1px solid #ddd;
    padding:15px;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

#sidebar h2{
    margin-top:0;
}

#sidebar input,
#sidebar select{
    width:100%;
    padding:8px;
    margin-bottom:12px;
    box-sizing:border-box;
}

#map{
    flex:1;
    height:100vh;
}

</style>

</head>

<body>

<div id="sidebar">

<h2>PATPEN</h2>

<label for="search">Recherche</label>
<input
id="search"
type="text"
placeholder="Nom du lieu..."
>

<label for="categorie">Catégorie</label>

<select id="categorie">

<option value="">
Toutes
</option>

<option value="Puits">
Puits
</option>

<option value="Lavoir">
Lavoir
</option>

<option value="Fontaine">
Fontaine
</option>

<option value="Croix">
Croix
</option>

<option value="Four à pain">
Four à pain
</option>

</select>

</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// Carte centrée sur Pénestin

const map = L.map('map').setView(
    [47.482, -2.475],
    13
);

// Fond OpenStreetMap

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        maxZoom:19,
        attribution:'© OpenStreetMap'
    }
).addTo(map);

// Marqueur de test

L.marker(
    [47.482, -2.475]
)
.addTo(map)
.bindPopup(
    '<b>PATPEN</b><br>Patrimoine & Mémoire de Pénestin'
);

</script>

</body>
</html>
