<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PATPEN - Contribution</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#aad3df;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
}

#map{
    height:400px;
    border-radius:10px;
    margin-bottom:15px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    box-sizing:border-box;
}

button{
    padding:12px 18px;
    background:#9b4b82;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#7f3d6a;
}

h2{
    color:#2c3e50;
}

.success{
    background:#dff0d8;
    color:#3c763d;
    padding:10px;
    border-radius:6px;
    display:none;
}

.error{
    background:#f2dede;
    color:#a94442;
    padding:10px;
    border-radius:6px;
    display:none;
}

</style>
</head>

<body>

<div class="container">

<h1>PATPEN</h1>
<p>Inventaire du Patrimoine et de la Mémoire de Pénestin</p>

<div id="success" class="success">
Contribution enregistrée avec succès.
</div>

<div id="error" class="error">
Erreur d'envoi.
</div>

<form id="f">

<h2>Localisation</h2>

<div id="map"></div>

<input id="lat" name="latitude" placeholder="Latitude" readonly>
<input id="lng" name="longitude" placeholder="Longitude" readonly>

<input name="commune" value="Pénestin">

<input name="lieudit" placeholder="Lieu-dit">

<input name="adresse" placeholder="Adresse">

<h2>Désignation</h2>

<select name="categorie" required>

<option value="">Choisir...</option>
<option>Puits</option>
<option>Fontaine</option>
<option>Lavoir</option>
<option>Four</option>
<option>Moulin</option>
<option>Arbre remarquable</option>
<option>Calvaire</option>
<option>Croix</option>
<option>Chapelle</option>
<option>Mégalithe</option>
<option>Patrimoine bâti</option>

</select>

<input name="nom" placeholder="Nom">

<input name="nom_local" placeholder="Nom local">

<input name="epoque" placeholder="Époque">

<h2>Propriété</h2>

<input name="proprietaire" placeholder="Propriétaire">

<select name="acces">
<option>Libre</option>
<option>Restreint</option>
</select>

<h2>Description</h2>

<textarea
name="description"
rows="5"
placeholder="Description">
</textarea>

<input name="materiaux" placeholder="Matériaux">

<h2>Historique</h2>

<input name="periode" placeholder="Période">

<textarea
name="historique"
rows="5"
placeholder="Historique">
</textarea>

<h2>Observations</h2>

<textarea
name="commentaires"
rows="5"
placeholder="Commentaires">
</textarea>

<button type="submit">
Envoyer la contribution
</button>

</form>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const WEBAPP_URL =
https://script.google.com/macros/s/AKfycbyS5upmnHbfLttMDhkq2Ejf2MrT5G_dDlSxUD5Zv6cKUHBGKCc2Ga_pr71Ar5KHJixZHQ/exec;

const map =
L.map("map")
.setView([47.483,-2.48],14);

L.tileLayer(
"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
{
attribution:"© OpenStreetMap"
}
).addTo(map);

let marker =
L.marker([47.483,-2.48])
.addTo(map);

document.getElementById("lat").value =
47.483000;

document.getElementById("lng").value =
-2.480000;

map.on("click", function(e){

marker.setLatLng(e.latlng);

document.getElementById("lat").value =
e.latlng.lat.toFixed(6);

document.getElementById("lng").value =
e.latlng.lng.toFixed(6);

});

document
.getElementById("f")
.addEventListener("submit",
async function(e){

e.preventDefault();

const data =
Object.fromEntries(
new FormData(this)
);

try{

const r =
await fetch(
WEBAPP_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);

if(!r.ok){
throw new Error();
}

document
.getElementById("success")
.style.display="block";

document
.getElementById("error")
.style.display="none";

this.reset();

}
catch(err){

document
.getElementById("error")
.style.display="block";

document
.getElementById("success")
.style.display="none";

console.error(err);

}

});

</script>

</body>
</html>
