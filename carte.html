<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN - Carte du patrimoine</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>




html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
}






      
body{
    margin:0;
}


#map{
    width:100%;
    height:100%;
}

/* ==========================
   PANNEAU DETAIL
========================== */

.fiche-panel{
    position:fixed;
    background:white;
    z-index:9999;
    overflow-y:auto;
    box-shadow:0 0 20px rgba(0,0,0,.25);
}

/* ==========================
   VERSION PC
========================== */

@media (min-width:769px){

    .fiche-panel{

        top:0;
        right:-450px;

        width:420px;
        height:100vh;

        transition:right .3s ease;

        border-radius:0;
    }

    .fiche-panel.open{

        right:0;
    }
}

/* ==========================
   VERSION MOBILE
========================== */

@media (max-width:768px){

    body{
        flex-direction:column;
    }


#map{
    height:100%;
}

  

    
    .fiche-panel{

        left:0;
        right:0;

        bottom:-55vh;

        height:50vh;

        transition:bottom .3s ease;

        border-radius:20px 20px 0 0;
    }

    .fiche-panel.open{

        bottom:0;
    }
}

/* ==========================
   CONTENU FICHE
========================== */

.drag-bar{

    width:50px;
    height:5px;

    background:#bdbdbd;

    border-radius:5px;

    margin:10px auto;
}

.panel-header{

    position:relative;

    height:0;

    padding:0;

    border:none;
}

.panel-header button{

    position:absolute;

    top:8px;

    right:15px;

    border:none;

    background:none;

    cursor:pointer;

    font-size:28px;

    color:#666;

    z-index:1000;
}

.tuile-photo{

    padding:15px;
}

.tuile-photo img{

    width:100%;

    max-height:220px;

    object-fit:cover;

    border-radius:12px;

    display:block;
}

.tuile-info{

    padding:20px;
}

.tuile-info h2{

    margin-top:0;
    color:#205ba4;
}

.tuile-info p{

    margin:10px 0;

    line-height:1.5;
}

.card-photo{

    margin:15px;

    background:white;

    border-radius:12px;

    overflow:hidden;

    box-shadow:
        0 2px 8px rgba(0,0,0,.10);
}

.card-photo img{

    width:100%;

    height:160px;

    object-fit:cover;

    display:block;
}
.fiche-title{

    color:#205ba4;

    font-size:30px;

    margin:10px 0;

    font-weight:700;
}

.separator{

    height:1px;

    background:#dddddd;

    margin:15px 0;
}

.description-card{

    background:#eef4fb;

    border-left:5px solid #205ba4;

    border-radius:12px;

    padding:15px;

    margin-bottom:20px;

    line-height:1.6;
}

.info-bloc{

    padding:12px 0;

    border-bottom:1px solid #e5e5e5;
}

.info-bloc label{

    display:block;

    color:#666;

    font-size:13px;

    font-weight:bold;

    margin-bottom:6px;
}

.panel-toolbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:10px 15px;

    border-bottom:1px solid #e5e5e5;
}

.close-btn{

    border:none;

    background:none;

    color:#777;

    font-size:26px;

    cursor:pointer;
}

.fiche-btn{

    border:none;

    background:#205ba4;

    color:white;

    padding:8px 14px;

    border-radius:8px;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;
}      

.leaflet-control-addfiche a{

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#205ba4;
    color:#fff !important;

    text-decoration:none;

    border-radius:8px;

    font-size:28px;
    font-weight:bold;

    box-shadow:
        0 2px 8px rgba(0,0,0,.25);
}

.leaflet-control-addfiche a:hover{

    background:#184b88;
}

.leaflet-control-addfiche{

    margin-top:10px;
}


.leaflet-control-basemap a{

    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:white;
    color:#333;

    border-radius:8px;





      

    text-decoration:none;

    font-size:22px;
}

.basemap-panel{

    position:absolute;

    top:20px;
    left:70px;

    width:320px;

    background:white;

    border-radius:20px;

    box-shadow:
        0 6px 30px rgba(0,0,0,.25);

    z-index:9999;

    display:none;
}

.basemap-panel.open{
    display:block;
}


.basemap-grid{

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:15px;

    padding:20px;
}

.basemap-item{

    cursor:pointer;

    text-align:center;
}

.basemap-item img{

    width:100%;
    height:90px;

    object-fit:cover;

    border-radius:16px;

    border:3px solid transparent;
}

.basemap-item.active img{

    border-color:#b34ca0;
}

.basemap-header{

    display:flex;
    align-items:center;

    gap:15px;

    padding:20px;

    border-bottom:1px solid #ddd;
}

.basemap-header h2{

    margin:0;

    font-size:26px;
}

.close-map-panel{

    cursor:pointer;

    font-size:38px;

    color:#666;
}

.basemap-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:18px;

    padding:20px;
}

.basemap-item{

    cursor:pointer;

    text-align:center;
}

.basemap-item span{

    display:block;

    margin-top:8px;

    font-size:15px;
}

.basemap-item img{

    width:100%;

    height:100px;

    object-fit:cover;

    border-radius:14px;

    border:3px solid transparent;
}

.basemap-item.active img{

    border-color:#b24d9a;
}






      

      
</style>

</head>

<body>


<div id="map"></div>

<!-- ==========================
     FICHE PATRIMOINE
========================== -->

<div id="fichePanel" class="fiche-panel">

    <div class="drag-bar"></div>


      
<div class="panel-toolbar">

    <button
        class="close-btn"
        onclick="fermerPanel()">
        ✕
    </button>

    <button
        class="fiche-btn"
        onclick="ouvrirFicheComplete()">
        FICHE
    </button>

</div>


      

<div class="card-photo">

    <img id="fichePhoto"
         src=""
         alt="Photo du patrimoine">

</div>

<div class="tuile-info">

    <h2 id="ficheTitre" class="fiche-title"></h2>

    <div class="separator"></div>

    <div class="description-card">

        <div id="ficheDescription"></div>

    </div>

    <div class="info-bloc">

        <label>Catégorie</label>

        <div id="ficheCategorie"></div>

    </div>

    <div class="info-bloc">

        <label>Commune</label>

        <div id="ficheCommune"></div>

    </div>

    <div class="info-bloc">

        <label>Adresse</label>

        <div id="ficheAdresse"></div>

    </div>

</div>








      
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

/* ==========================
   GOOGLE SHEET
========================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/12Zo6EKHmgA-NlKnUbjerfRS78BH34dO-dhYuq5RcNls/gviz/tq?tqx=out:csv&gid=545961012";

/* ==========================
   CARTE
========================== */

const map = L.map("map").setView(
    [47.482,-2.475],
    14
);




      
/* ==========================
   FONDS DE CARTE
========================== */

const osm = L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
);

const topo = L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    {
        maxZoom:17,
        attribution:"© OpenTopoMap"
    }
);

const satellite = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    {
        attribution:"© Esri"
    }
);


osm.addTo(map);








      

const AddFicheControl = L.Control.extend({

    options:{
        position:'topleft'
    },

    onAdd:function(){

        const container = L.DomUtil.create(
            'div',
            'leaflet-bar leaflet-control leaflet-control-addfiche'
        );

        container.innerHTML =
            '<a href="identification+formulaire.html" title="Ajouter un élément">+</a>';

        L.DomEvent.disableClickPropagation(container);

        return container;
    }
});

map.addControl(new AddFicheControl());

const BasemapControl = L.Control.extend({

    options:{
        position:'topleft'
    },

    onAdd:function(){

        const container = L.DomUtil.create(
            'div',
            'leaflet-bar leaflet-control leaflet-control-basemap'
        );

        container.innerHTML =
            '<a href="#" title="Fonds de carte">🗺️</a>';

        container.onclick = function(){

            toggleBasemapPanel();

            return false;
        };

        return container;
    }
});

map.addControl(new BasemapControl());

function toggleBasemapPanel(){

    document
        .getElementById("basemapPanel")
        .classList
        .toggle("open");
}

function changeBaseMap(type,element){

    if(map.hasLayer(osm)) map.removeLayer(osm);
    if(map.hasLayer(topo)) map.removeLayer(topo);
    if(map.hasLayer(satellite)) map.removeLayer(satellite);
   

    if(type==="osm") osm.addTo(map);
    if(type==="topo") topo.addTo(map);
    if(type==="satellite") satellite.addTo(map);
   

    document
        .querySelectorAll(".basemap-item")
        .forEach(el => el.classList.remove("active"));

    element.classList.add("active");
}

















      
/* ==========================
   ICÔNES PATPEN
========================== */

const icons = {

    "Puits":"images/categories/puits.svg",
    "Fontaine":"images/categories/fontaine.svg",
    "Lavoir":"images/categories/lavoir.svg",
    "Four à pain":"images/categories/four.svg",
    "Arbre remarquable":"images/categories/arbre.svg",
    "Croix-Calvaire":"images/categories/croix.svg",
    "Moulin":"images/categories/moulin.svg",
    "Maison remarquable":"images/categories/maison.svg",
    "Chemin rural":"images/categories/chemin.svg",
    "Chapelle":"images/categories/chapelle.svg"

};

function getIconUrl(categorie){

    return icons[categorie]
        || "images/categories/puits.svg";
}

/* ==========================
   PHOTO GOOGLE DRIVE
========================== */

function getDriveImage(url){

    if(!url) return "";

    const match = url.match(/\/d\/([^\/]+)/);

    if(match){

        return "https://drive.google.com/thumbnail?id="
             + match[1]
             + "&sz=w1200";
    }

    return url;
}

/* ==========================
   PANNEAU
========================== */

function ouvrirPanel(data){

    document.getElementById("ficheTitre")
        .textContent = data.nom || "";

    document.getElementById("ficheDescription")
        .textContent = data.description || "";

    document.getElementById("ficheCategorie")
        .textContent = data.categorie || "";

    document.getElementById("ficheCommune")
        .textContent = data.commune || "";

    document.getElementById("ficheAdresse")
        .textContent = data.adresse || "";

    const photo =
        document.getElementById("fichePhoto");

    if(data.photo){

        photo.src = data.photo;
        photo.style.display = "block";

    }else{

        photo.style.display = "none";
    }

    document.getElementById("fichePanel")
        .classList.add("open");
}

function fermerPanel(){

    document.getElementById("fichePanel")
        .classList.remove("open");
}

function ouvrirFicheComplete(){

    alert(
        "La fiche détaillée sera ajoutée prochainement."
    );
}





      
/* ==========================
   CHARGEMENT DES FICHES
========================== */

const markers = [];

Papa.parse(CSV_URL,{

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        results.data.forEach(function(fiche){

            const lat =
                parseFloat(fiche.latitude);

            const lng =
                parseFloat(fiche.longitude);

            if(
                isNaN(lat) ||
                isNaN(lng)
            ){
                return;
            }

            const nom =
                fiche.nom || "";

            const description =
                fiche.description || "";

            const categorie =
                fiche.categorie || "";

            const commune =
                fiche.commune || "";

            const adresse =
                fiche.adresse || "";

            const photo =
                getDriveImage(
                    fiche.photos || ""
                );

            const marker = L.marker(
                [lat,lng],
                {
                    icon:L.icon({

                        iconUrl:getIconUrl(
                            categorie
                        ),

                        iconSize:[40,40],

                        iconAnchor:[20,40]
                    })
                }
            ).addTo(map);

            markers.push(marker);

            marker.on("click", function(){

                ouvrirPanel({

                    nom:nom,
                    description:description,
                    categorie:categorie,
                    commune:commune,
                    adresse:adresse,
                    photo:photo

                });

            });

        });

        if(markers.length){

            const group =
                L.featureGroup(markers);

            map.fitBounds(
                group.getBounds(),
                {
                    padding:[30,30]
                }
            );
        }

    },

    error:function(error){

        console.error(
            "Erreur de chargement CSV :",
            error
        );
    }

});

</script>
<div id="basemapPanel" class="basemap-panel">

    <div class="basemap-header">
        <span onclick="toggleBasemapPanel()" class="close-map-panel">✕</span>
        <h2>Fonds de carte</h2>
    </div>

    <div class="basemap-grid">

        <div class="basemap-item active"
             onclick="changeBaseMap('osm',this)">
            <img src="images/fonds/osm.jpg">
            <span>OpenStreetMap</span>
        </div>

        <div class="basemap-item"
             onclick="changeBaseMap('topo',this)">
            <img src="images/fonds/topo.jpg">
            <span>Relief</span>
        </div>

        <div class="basemap-item"
             onclick="changeBaseMap('carto',this)">
            <img src="images/fonds/carto.jpg">
            <span>Fond clair</span>
        </div>

        <div class="basemap-item"
             onclick="changeBaseMap('satellite',this)">
            <img src="images/fonds/satellite.jpg">
            <span>Photo aérienne</span>
        </div>

        <div class="basemap-item"
             onclick="changeBaseMap('hybrid',this)">
            <img src="images/fonds/hybrid.jpg">
            <span>Photo + noms</span>
        </div>

    </div>

</div>
</body>
</html>
