<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>À propos de PATPEN</title>

<link rel="icon" type="image/png" href="favicon-PATPEN6.png">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#aad3df;
    display:flex;
    justify-content:center;
    padding:30px;
    box-sizing:border-box;
}

.app{
    width:95%;
    max-width:1000px;
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.15);
    display:flex;
}

.sidebar{
    width:180px;
    background:#f7f7f7;
    border-right:1px solid #ddd;
    padding:15px;
}

.sidebar h2{
    margin-top:0;
    text-align:center;
}

.step{
    padding:6px;
    font-size:12px;
}

.active-step{
    font-weight:bold;
    color:#9b4b82;
}

.content{
    flex:1;
    padding:30px;
}

.logo{
    width:120px;
    display:block;
    margin:auto;
}

h1{
    text-align:center;
    color:#205ba4;
}

h2{
    color:#9b4b82;
    margin-top:30px;
}

p{
    line-height:1.7;
}

ul{
    line-height:1.8;
}

.encadre{
    background:#f5f8fc;
    border-left:5px solid #205ba4;
    border-radius:8px;
    padding:20px;
    margin-top:25px;
}

.btn-retour{
    display:inline-block;
    margin-top:30px;
    padding:12px 20px;
    background:#205ba4;
    color:white;
    text-decoration:none;
    border-radius:8px;
    font-weight:bold;
}

.btn-retour:hover{
    background:#184b88;
}

.footer{
    margin-top:40px;
    text-align:center;
    border-top:1px solid #ddd;
    padding-top:20px;
}

.footer h3{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin:0;
}

.footer img{
    height:40px;
}

@media (max-width:768px){

    body{
        padding:5px;
    }

    .app{
        display:block;
        width:100%;
    }

    .sidebar{
        display:none;
    }

    .content{
        padding:15px;
    }

}

</style>
</head>

<body>

<div class="app">

    <div class="sidebar">
