<html lang="fr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

html,
body{
    margin:0;
    height:100%;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
}

/* MENU MOBILE */

#menuBtn{
    display:none;
}

/* PANNEAU */

#sidebar{
    width:320px;
    background:#f5f5f5;
    border-right:1px solid #ddd;
    padding:15px;
    box-sizing:border-box;
    overflow:auto;
}

#sidebar h2{
    margin-top:0;
}

input,
select{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    box-sizing:border-box;
}

#map{
    flex:1;
    height:100vh;
}

.photo-popup{
    width:100%;
    max-height:220px;
    object-fit:cover;
    border-radius:4px;
}

#log{
    font-size:12px;
    color:#444;
}

@media (max-width:768px){

    body{
        display:block;
    }

    }

    }

    #sidebar.open{
        left:0;
