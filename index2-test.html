<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN - Carte du patrimoine</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

html,body{
    margin:0;
    padding:0;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
}

/* ==========================
   MENU
========================== */

#sidebar{
    width:260px;
    background:#205ba4;
    color:white;
    padding:20px;
    box-sizing:border-box;
}

#sidebar h1{
    margin-top:0;
    font-size:48px;
}

#btnFormulaire{
    width:100%;
    padding:15px;
    background:white;
    color:#205ba4;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* ==========================
   CARTE
========================== */

#map{
    flex:1;
    height:100vh;
}

/* ==========================
   FICHE PATRIMOINE
========================== */

.fiche-panel{

    position:fixed;

    left:0;
    right:0;
    bottom:-100%;

    height:75vh;

    background:white;

    z-index:9999;

    border-radius:20px 20px 0 0;

    transition:.35s;

    box-shadow:0 -4px 20px rgba(0,0,0,.25);

    overflow-y:auto;
}

.fiche-panel.open{
    bottom:0;
}

.panel-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:15px;

    border-bottom:1px solid #ddd;

    font-size:20px;

    font-weight:bold;
}

.panel-header button{

    border:none;

    background:none;

    cursor:pointer;

    font-size:28px;
}

.tuile-photo{

    padding:15px;
}

.tuile-photo img{

    width:100%;

    border-radius:12px;

    display:block;
}

.tuile-info{

    padding:15px;
}

.tuile-info h2{

    margin-top:0;

    color:#205ba4;
}

/* ==========================
   MOBILE
========================== */

@media(max-width:768px){

    body{
        flex-direction:column;
    }

    #sidebar{
        width:100%;
        height:auto;
    }

    #map{
        height:calc(100vh - 140px);
    }
}

</style>

</head>

<body>

<div id="sidebar">

    <h1>PATPEN</h1>

    <button id="btnFormulaire"
        onclick="window.location.href='identification+formulaire.html'">
        ➕ Ajouter une fiche
    </button>

</div>

<div id="map"></div>

<!-- ==========================
     PANNEAU DETAIL
========================== -->

<div id="fichePanel" class="fiche-panel">

    <div class="panel-header">

        <span>Détail du patrimoine</span>

        <button onclick="fermerPanel()">✕</button>

    </div>

    <div class="tuile-photo">

        <img id="fichePhoto" src="">

    </div>

    <div class="tuile-info">

        <h2 id="ficheTitre"></h2>

        <p id="ficheDescription"></p>

        <p>
            <strong>Catégorie :</strong>
            <span id="ficheCategorie"></span>
        </p>

        <p>
            <strong>Commune :</strong>
            <span id="ficheCommune"></span>
        </p>

        <p>
            <strong>Adresse :</strong>
            <span id="ficheAdresse"></span>
        </p>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<script>

/* ==========================
   GOOGLE SHEET
========================== */

const CSV_URL =
"https://docs.google.com/spreadsheets/d/12Zo6EKHmgA-NlKnUbjerfRS78BH34dO-dhYuq5RcNls/gviz/tq?tqx=out:csv&gid=545961012";

/* ==========================
   CARTE
========================== */

const map = L.map("map").setView(
    [47.482,-2.475],
    15
);

L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap"
    }
).addTo(map);

/* ==========================
   ICONES
========================== */

const icons = {

    "Puits":"images/categories/puits.svg",
    "Fontaine":"images/categories/fontaine.svg",
    "Lavoir":"images/categories/lavoir.svg",
    "Four à pain":"images/categories/four.svg",
    "Arbre remarquable":"images/categories/arbre.svg",
    "Croix-Calvaire":"images/categories/croix.svg",
    "Moulin":"images/categories/moulin.svg",
    "Maison remarquable":"images/categories/maison.svg",
    "Chemin rural":"images/categories/chemin.svg",
    "Chapelle":"images/categories/chapelle.svg"
};

function getIconUrl(categorie){

    return icons[categorie]
        || "images/categories/puits.svg";
}

/* ==========================
   IMAGE DRIVE
========================== */

function getDriveImage(url){

    if(!url) return "";

    const match =
        url.match(/\/d\/([^\/]+)/);

    if(match){

        return "https://drive.google.com/thumbnail?id="
            + match[1]
            + "&sz=w1200";
    }

    return url;
}

/* ==========================
   PANNEAU
========================== */

function ouvrirPanel(data){

    document.getElementById("ficheTitre")
        .textContent = data.nom || "";

    document.getElementById("ficheDescription")
        .textContent = data.description || "";

    document.getElementById("ficheCategorie")
        .textContent = data.categorie || "";

    document.getElementById("ficheCommune")
        .textContent = data.commune || "";

    document.getElementById("ficheAdresse")
        .textContent = data.adresse || "";

    document.getElementById("fichePhoto")
        .src = data.photo || "";

    document.getElementById("fichePanel")
        .classList.add("open");
}

function fermerPanel(){

    document.getElementById("fichePanel")
        .classList.remove("open");
}

/* ==========================
   CHARGEMENT SHEET
========================== */

Papa.parse(CSV_URL,{

    download:true,

    header:true,

    skipEmptyLines:true,

    complete:function(results){

        results.data.forEach(function(fiche){

            const lat =
                parseFloat(fiche.latitude);

            const lng =
                parseFloat(fiche.longitude);

            if(
                isNaN(lat) ||
                isNaN(lng)
            ){
                return;
            }

            const nom =
                fiche.nom || "";

            const description =
                fiche.description || "";

            const categorie =
                fiche.categorie || "";

            const commune =
                fiche.commune || "";

            const adresse =
                fiche.adresse || "";

            const photo =
                getDriveImage(
                    fiche.photos || ""
                );

            const marker = L.marker(
                [lat,lng],
                {
                    icon:L.icon({

                        iconUrl:getIconUrl(
                            categorie
                        ),

                        iconSize:[40,40],

                        iconAnchor:[20,40]
                    })
                }
            ).addTo(map);

            marker.on(
                "click",
                function(){

                    ouvrirPanel({

                        nom:nom,

                        description:description,

                        categorie:categorie,

                        commune:commune,

                        adresse:adresse,

                        photo:photo
                    });

                }
            );

        });

    }

});

</script>

</body>
</html>
