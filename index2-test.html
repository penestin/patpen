<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PATPEN</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

/* =========================
   PAGE
========================= */

html,body{
    margin:0;
    padding:0;
    height:100%;
}

body{
    display:flex;
    flex-direction:row;
}

/* =========================
   SIDEBAR
========================= */

#sidebar{
    width:220px;
    background:#205ba4;
    color:white;
    padding:15px;
    box-sizing:border-box;
}

#sidebar h1{
    margin-top:0;
}

#btnFormulaire{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:white;
    color:#205ba4;
    font-weight:bold;
    cursor:pointer;
}

/* =========================
   CARTE
========================= */

#map{
    flex:1;
    height:100vh;
}

/* =========================
   PANNEAU FICHE
========================= */

.fiche-panel{

    position:fixed;

    left:0;
    right:0;
    bottom:-100%;

    height:75vh;

    background:white;

    border-radius:20px 20px 0 0;

    box-shadow:0 -5px 20px rgba(0,0,0,.25);

    transition:.3s ease;

    z-index:9999;

    overflow-y:auto;
}

.fiche-panel.open{
    bottom:0;
}

.panel-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:15px;

    border-bottom:1px solid #ddd;

    font-weight:bold;
}

.panel-header button{

    border:none;

    background:none;

    font-size:24px;

    cursor:pointer;
}

.tuile-photo{

    padding:15px;
}

.tuile-photo img{

    width:100%;

    border-radius:12px;

    display:block;
}

.tuile-info{

    padding:15px;
}

.tuile-info h2{

    margin-top:0;

    color:#205ba4;
}

@media(max-width:768px){

    body{
        flex-direction:column;
    }

    #sidebar{
        width:100%;
    }

    #map{
        height:calc(100vh - 120px);
    }
}

</style>
</head>

<body>

<!-- COLONNE BLEUE -->

<div id="sidebar">

    <h1>PATPEN</h1>

    <button id="btnFormulaire">
        ➕ Ajouter une fiche
    </button>

</div>

<!-- CARTE -->

<div id="map"></div>

<!-- PANNEAU DETAIL -->

<div id="fichePanel" class="fiche-panel">

    <div class="panel-header">

        <span>Détail du patrimoine</span>

        <button onclick="fermerPanel()">✕</button>

    </div>

    <div class="tuile-photo">

        <img id="fichePhoto" src="">

    </div>

    <div class="tuile-info">

        <h2 id="ficheTitre"></h2>

        <p id="ficheDescription"></p>

        <p>
            <strong>Auteur :</strong>
            <span id="ficheAuteur"></span>
        </p>

        <p>
            <strong>Secteur :</strong>
            <span id="ficheSecteur"></span>
        </p>

        <p>
            <strong>Date :</strong>
            <span id="ficheDate"></span>
        </p>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* =========================
   CARTE
========================= */

const map = L.map('map')
.setView([47.482,-2.475],15);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

/* =========================
   PANNEAU
========================= */

function ouvrirPanel(data){

    document.getElementById("ficheTitre").textContent =
        data.nom || "";

    document.getElementById("ficheDescription").textContent =
        data.description || "";

    document.getElementById("ficheAuteur").textContent =
        data.auteur || "";

    document.getElementById("ficheSecteur").textContent =
        data.secteur || "";

    document.getElementById("ficheDate").textContent =
        data.date || "";

    document.getElementById("fichePhoto").src =
        data.photo || "";

    document
       .getElementById("fichePanel")
       .classList.add("open");
}

function fermerPanel(){

    document
        .getElementById("fichePanel")
        .classList.remove("open");
}

/* =========================
   EXEMPLE MARQUEUR
========================= */

const marker = L.marker(
    [47.482,-2.475]
).addTo(map);

marker.on("click",function(){

    ouvrirPanel({

        nom:"Lavoir des Demoiselles",

        description:
        "Ancien lavoir utilisé par les habitants du bourg.",

        auteur:"Noël Joly",

        secteur:"Centre-Bourg",

        date:"2026",

        photo:
        "https://via.placeholder.com/800x500"

    });

});

</script>

</body>
</html>
