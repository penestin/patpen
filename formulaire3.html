<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    background:#aad3df;
    font-family:Arial,sans-serif;
}

/* =========================
   CONTENEUR PRINCIPAL
========================= */

.app{
    max-width:1400px;
    min-height:900px;

    margin:auto;

    background:white;

    border-radius:25px;

    overflow:hidden;

    display:flex;

    box-shadow:0 12px 40px rgba(0,0,0,.15);
}

/* =========================
   SIDEBAR
========================= */

.sidebar{

    width:220px;
    min-width:220px;

    background:#f8f8f8;

    border-right:1px solid #ddd;

    padding:20px;
}

/* =========================
   LOGO
========================= */

.logo-box{

    text-align:center;

    margin-bottom:25px;

    padding-bottom:20px;

    border-bottom:1px solid #ddd;
}

.logo{

    width:140px;

    max-width:100%;

    height:auto;

    display:block;

    margin:0 auto 10px auto;
}

.subtitle{

    font-size:13px;

    color:#666;

    line-height:1.4;
}

/* =========================
   ETAPES
========================= */

.step{

    padding:12px 0;

    font-size:15px;

    color:#222;
}

.step.active{

    color:#9b4b82;

    font-weight:bold;
}

/* =========================
   CONTENU
========================= */

.content{

    flex:1;

    padding:35px;
}

.card{

    max-width:850px;
}

h2{

    font-size:64px;

    color:#2c3e50;

    margin-top:0;
    margin-bottom:25px;
}

/* =========================
   CARTE
========================= */

#map{

    height:520px;

    border-radius:16px;

    margin-bottom:20px;

    overflow:hidden;
}
