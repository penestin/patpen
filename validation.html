<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Validation des contributions PATPEN</title>

<style>

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#0b5394;
    color:white;
    text-align:center;
    padding:20px;
}

header h1{
    margin:0;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.compteur{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    margin-bottom:30px;
}

.photo{
    width:100%;
    max-height:400px;
    object-fit:cover;
    display:block;
}

.content{
    padding:20px;
}

.content h2{
    margin-top:0;
    color:#0b5394;
}

.meta{
    color:#666;
    margin-bottom:15px;
}

.info{
    margin:8px 0;
}

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

button{
    border:none;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.valider{
    background:#1b8f3d;
    color:white;
}

.refuser{
    background:#c62828;
    color:white;
}

.revoir{
    background:#ff9800;
    color:white;
}

button:hover{
    opacity:0.9;
}

.vide{
    text-align:center;
    padding:40px;
    background:white;
    border-radius:12px;
}

</style>
</head>

<body>

<header>
    <h1>Validation des contributions PATPEN</h1>
</header>

<div class="container">

    <div id="compteur" class="compteur">
        Chargement...
    </div>

    <div id="liste"></div>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbx4n1FdZuN-jMrM3myRBQzR8PNpPQP6CvVGW1boaHH07MkEtvzHYd9PX7c40mepltmc7w/exec";

charger();

function charger(){

    fetch(API_URL)
    .then(r => r.json())
    .then(data => {

const fiches = data.filter(f => {

    const statut = String(
        f.statut || ""
    )
    .trim()
    .toLowerCase();

    return (
        statut === "en attente" ||
        statut === "a valider" ||
        statut === "à valider" ||
        statut === "valider"
    );

});

        document.getElementById("compteur").innerHTML =
            fiches.length + " contribution(s) à valider";

        const liste =
            document.getElementById("liste");

        liste.innerHTML = "";

        if(fiches.length === 0){

            liste.innerHTML = `
                <div class="vide">
                    ✅ Aucune contribution en attente.
                </div>
            `;

            return;
        }

        fiches.forEach(fiche => {

            liste.innerHTML += `

            <div class="card">

                ${fiche.photos ?
                    `<img class="photo" src="${fiche.photos}" alt="">`
                    : ""
                }

                <div class="content">

                    <h2>${fiche.nom || "Sans nom"}</h2>

                    <div class="meta">
                        ${fiche.categorie || ""}
                        •
                        ${fiche.commune || ""}
                    </div>

                    <div class="info">
                        <strong>ID :</strong>
                        ${fiche.id || ""}
                    </div>

                    <div class="info">
                        <strong>Adresse :</strong>
                        ${fiche.adresse || "-"}
                    </div>

                    <div class="info">
                        <strong>Accès :</strong>
                        ${fiche.acces || "-"}
                    </div>

                    <div class="info">
                        <strong>Propriétaire :</strong>
                        ${fiche.proprietaire || "-"}
                    </div>

                    <div class="info">
                        <strong>Description :</strong><br>
                        ${fiche.description || "-"}
                    </div>

                    <div class="info">
                        <strong>Matériaux :</strong>
                        ${fiche.materiaux || "-"}
                    </div>

                    <div class="info">
                        <strong>Période :</strong>
                        ${fiche.periode || "-"}
                    </div>

                    <div class="info">
                        <strong>Historique :</strong><br>
                        ${fiche.historique || "-"}
                    </div>

                    <div class="info">
                        <strong>Commentaires :</strong><br>
                        ${fiche.commentaires || "-"}
                    </div>

                    <div class="actions">

                        <button
                            class="valider"
                            onclick="changerStatut('${fiche.id}','Validé')">
                            ✅ Valider
                        </button>

                        <button
                            class="refuser"
                            onclick="changerStatut('${fiche.id}','Refusé')">
                            ❌ Refuser
                        </button>

                        <button
                            class="revoir"
                            onclick="changerStatut('${fiche.id}','À revoir')">
                            🔄 À revoir
                        </button>

                    </div>

                </div>

            </div>

            `;
        });

    })
    .catch(error => {

        console.error(error);

        document.getElementById("compteur").innerHTML =
            "Erreur de chargement";

    });
}

function changerStatut(id, statut){

    if(!confirm("Confirmer : " + statut + " ?")){
        return;
    }

    fetch(API_URL,{
        method:"POST",
        body:JSON.stringify({
            id:id,
            statut:statut,
            valideur:"Noël JOLY"
        })
    })
    .then(r => r.json())
    .then(() => {
        charger();
    })
    .catch(err => {
        console.error(err);
        alert("Erreur lors de la mise à jour.");
    });

}

</script>

</body>
</html>
