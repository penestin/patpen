
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATPEN - Inventaire Patrimonial</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
ial,sans-serif;
    background:#f3eef2;
}

#app{
    display:flex;
    min-height:100vh;
}

.sidebar{
    width:260px;
    background:white;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

.step{
    padding:10px;
    border-radius:8px;
    margin-bottom:8px;
}

.active{
    background:#9b4b82;
    color:white;
}

.main{
    flex:1;
    padding:25px;
}

.card{
    background:white;
    border-radius:12px;
    padding:25px;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    margin-bottom:12px;
    box-sizing:border-box;
}

button{
    background:#9b4b82;
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

#map{
    height:400px;
    border-radius:12px;
    margin-bottom:15px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

.actions{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
}

.preview{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.preview img{
    width:120px;
    height:120px;
    object-fit:cover;
    border-radius:8px;
}

pre{
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    overflow:auto;
}
</style>
</head>

<body>

<div id="app">

<div class="sidebar">
<h2>PATPEN</h2>

<div id="sidebarSteps"></div>

</div>

<div class="main">

<div class="card">

<form id="patpenForm">

<!-- 1 -->
<div class="page active">
<h2>Localisation</h2>

<div id="map"></div>

<label>Latitude</label>
<input id="lat">

<label>Longitude</label>
<input id="lng">

<label>Commune</label>
<input id="commune" value="Pénestin">

<label>Lieu-dit</label>
<input id="lieudit">

<label>Adresse</label>
<input id="adresse">
</div>

<!-- 2 -->
<div class="page">

<h2>Illustrations</h2>

<input
id="photos"
type="file"
multiple
accept="image/*">

<div
id="preview"
class="preview">
</div>

<label>Légende</label>
<textarea id="legende"></textarea>

<label>Crédit</label>
<input id="credit">

</div>

<!-- 3 -->
<div class="page">

<h2>Désignation</h2>

<select id="categorie">

<option>Puits</option>
<option>Fontaine</option>
<option>Lavoir</option>
<option>Calvaire</option>
<option>Moulin</option>
<option>Chapelle</option>
<option>Chemin rural</option>
<option>Arbre remarquable</option>

</select>

<input
id="nom"
placeholder="Nom">

<input
id="nomlocal"
placeholder="Nom local">

<input
id="epoque"
placeholder="Époque">

</div>

<!-- 4 -->
<div class="page">

<h2>Propriété</h2>

<input
id="proprietaire"
placeholder="Propriétaire">

<select id="acces">

<option>Libre</option>
<option>Restreint</option>
<option>Interdit</option>

</select>

<select id="etat">

<option>Excellent</option>
<option>Bon</option>
<option>Moyen</option>
<option>Mauvais</option>
<option>Ruine</option>

</select>

</div>

<!-- 5 -->
<div class="page">

<h2>Description</h2>

<textarea
id="description"
rows="8"></textarea>

<input
id="materiaux"
placeholder="Matériaux">

<input
id="dimensions"
placeholder="Dimensions">

<textarea
id="caracteristiques"
rows="4"></textarea>

</div>

<!-- 6 -->
<div class="page">

<h2>Historique</h2>

<input
id="periode"
placeholder="Date ou période">

<textarea
id="historique"
rows="6"></textarea>

<textarea
id="sources"
rows="4"></textarea>

</div>

<!-- 7 -->
<div class="page">

<h2>Observations</h2>

<textarea
id="commentaires"
rows="6"></textarea>

<textarea
id="travaux"
rows="4"></textarea>

<h3>Aperçu JSON</h3>

<pre id="jsonPreview">
</pre>

<button
type="button"
onclick="exportJSON()">
Exporter JSON
</button>

</div>

</form>

<div class="actions">

<button onclick="previousStep()">
Précédent
</button>

<button onclick="nextStep()">
Suivant
</button>

</div>

</div>

</div>

</div>

https://unpkg.com/leaflet@1.9.4/dist/leaflet.jsscript>

<script>

const pages =
document.querySelectorAll(".page");

const stepNames = [
"Localisation",
"Illustrations",
"Désignation",
"Propriété",
"Description",
"Historique",
"Observations"
];

let currentStep=0;

const sidebar =
document.getElementById("sidebarSteps");

function renderSidebar(){

sidebar.innerHTML="";

stepNames.forEach((s,i)=>{

const div =
document.createElement("div");

div.className =
"step "+(i===currentStep?
"active":"");

div.textContent=
(i+1)+". "+s;

sidebar.appendChild(div);

});

}

function showStep(){

pages.forEach((p,i)=>{

p.classList.toggle(
"active",
i===currentStep
);

});

renderSidebar();

if(currentStep===6){
updatePreview();
}

}

function nextStep(){

if(currentStep<6){

currentStep++;

showStep();

}

}

function previousStep(){

if(currentStep>0){

currentStep--;

showStep();

}

}

renderSidebar();

/* Carte Leaflet */

const map =
L.map("map")
.setView(
[47.483,-2.48],
14
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
).addTo(map);

const marker =
L.marker(
[47.483,-2.48]
).addTo(map);

map.on("click",(e)=>{

marker.setLatLng(e.latlng);

lat.value =
e.latlng.lat.toFixed(6);

lng.value =
e.latlng.lng.toFixed(6);

saveLocal();

});

/* Upload photos */

photos.addEventListener(
"change",
function(){

preview.innerHTML="";

[...this.files]
.forEach(file=>{

const reader =
new FileReader();

reader.onload=e=>{

const img=
document.createElement("img");

img.src=e.target.result;

preview.appendChild(img);

};

reader.readAsDataURL(file);

});

saveLocal();

}
);

/* Sauvegarde */

function getData(){

return {

localisation:{
lat:lat.value,
lng:lng.value,
commune:commune.value,
lieudit:lieudit.value,
adresse:adresse.value
},

designation:{
categorie:categorie.value,
nom:nom.value,
nomlocal:nomlocal.value,
epoque:epoque.value
},

propriete:{
proprietaire:proprietaire.value,
acces:acces.value,
etat:etat.value
},

description:{
description:description.value,
materiaux:materiaux.value,
dimensions:dimensions.value,
caracteristiques:caracteristiques.value
},

historique:{
periode:periode.value,
historique:historique.value,
sources:sources.value
},

observations:{
commentaires:commentaires.value,
travaux:travaux.value
}
};

}

function saveLocal(){

localStorage.setItem(
"PATPEN",
JSON.stringify(
getData()
)
);

}

function updatePreview(){

jsonPreview.textContent =
JSON.stringify(
getData(),
null,
2
);

}

document
.querySelectorAll(
"input,textarea,select"
)
.forEach(el=>{

el.addEventListener(
"change",
saveLocal
);

});

/* Charger */

const saved =
localStorage.getItem(
"PATPEN"
);

if(saved){

try{

const d =
JSON.parse(saved);

if(d.localisation){

lat.value=d.localisation.lat||"";
lng.value=d.localisation.lng||"";
commune.value=d.localisation.commune||"";
lieudit.value=d.localisation.lieudit||"";
adresse.value=d.localisation.adresse||"";

}

}catch(e){}

}

/* Export */

function exportJSON(){

const blob =
new Blob(

[
JSON.stringify(
getData(),
null,
2
)
],

{
type:"application/json"
}
);

const url =
URL.createObjectURL(
blob
);

const a =
document.createElement("a");

a.href=url;

a.download=
"PATPEN.json";

a.click();

}
