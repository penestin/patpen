<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PATPEN - Inventaire patrimonial</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:"Open Sans",sans-serif;
background:#f5f2f8;
color:#222;
}

.wrapper{
max-width:1400px;
margin:auto;
padding:20px;
display:flex;
gap:20px;
}

.sidebar{
width:260px;
background:#fff;
border-radius:12px;
padding:20px;
position:sticky;
top:20px;
height:fit-content;
box-shadow:0 2px 12px rgba(0,0,0,.1);
}

.content{
flex:1;
display:flex;
justify-content:center;
}

.card{
width:100%;
max-width:900px;
background:#fff;
border-radius:12px;
padding:24px;
box-shadow:0 2px 12px rgba(0,0,0,.1);
}

.step{
padding:10px;
margin-bottom:6px;
border-radius:8px;
}

.step.active{
background:#f0e5ed;
color:#9b4b82;
font-weight:bold;
}

.page{display:none;}
.page.active{display:block;}

input,
textarea,
select{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:8px;
font-size:15px;
}

button{
background:#9b4b82;
color:white;
border:none;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
}

#map{
width:100%;
height:400px;
border-radius:10px;
margin-bottom:15px;
}

#preview{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(120px,1fr));
gap:10px;
}

.thumb img{
width:100%;
height:120px;
object-fit:cover;
border-radius:8px;
}

.buttons{
display:flex;
justify-content:space-between;
gap:10px;
margin-top:15px;
}

#json{
background:#f5f5f5;
padding:15px;
border-radius:8px;
overflow:auto;
}

@media(max-width:1024px){

.wrapper{
flex-direction:column;
}

.sidebar{
width:100%;
position:relative;
}

}

@media(max-width:768px){

.wrapper{
padding:10px;
}

.buttons{
flex-direction:column;
}

button{
width:100%;
}

#map{
height:300px;
}

}
</style>
</head>

<body>

<div class="wrapper">

<div class="sidebar">
<h2>PATPEN</h2>
<div id="steps"></div>

<hr>

<input
type="file"
id="importJSON"
accept=".json">

<button
type="button"
onclick="importFiche()">
Importer une fiche
</button>

</div>

<div class="content">

<div class="card">

<form id="f">

<div class="page active">

<h2>1. Localisation</h2>

<div id="map"></div>

<input id="lat" placeholder="Latitude">
<input id="lng" placeholder="Longitude">

<input id="commune"
value="Pénestin"
placeholder="Commune">

<input id="lieudit"
placeholder="Lieu-dit">

<input id="adresse"
placeholder="Adresse">

<button
type="button"
onclick="gps()">
Utiliser ma position GPS
</button>

</div>
