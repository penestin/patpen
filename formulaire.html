<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>PATPEN - Inventaire patrimonial</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#aad3df;
    display:flex;
    justify-content:center;
    padding:30px;
    box-sizing:border-box;
}

.app{
    width:95%;
    max-width:1000px;
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,0.15);
    display:flex;
}

.sidebar{
    width:180px;
    background:#f7f7f7;
    border-right:1px solid #ddd;
    padding:15px;
}

.sidebar h2{
    margin-top:0;
    text-align:center;
}

.step{
    padding:6px;
    font-size:12px;
}

.active-step{
    font-weight:bold;
    color:#9b4b82;
}

.content{
    flex:1;
    padding:20px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

#map{
    height:350px;
    border-radius:10px;
    margin-bottom:10px;
}

input,
textarea,
select{
    width:100%;
    padding:10px;
    margin:8px 0;
    box-sizing:border-box;
}

button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#9b4b82;
    color:white;
}

button:hover{
    background:#7e3c69;
}

#json{
    background:#f3f3f3;
    padding:10px;
    border-radius:8px;
    white-space:pre-wrap;
}

.success{
    display:none;
    background:#dff0d8;
    color:#3c763d;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
}

.error{
    display:none;
    background:#f2dede;
    color:#a94442;
    padding:10px;
    border-radius:6px;
    margin-bottom:10px;
}

.nav{
    margin-top:15px;
    display:flex;
    justify-content:space-between;
}
.send-btn{
    margin-top:20px;
    background:#28a745;
    color:white;
    font-weight:bold;
    font-size:16px;
    padding:12px 24px;
}

.send-btn:hover{
    background:#218838;
}

.restart-btn{
    background:#009688 !important;
    color:white;
}

.restart-btn:hover{
    background:#00796b !important;
}
</style>
</head>

<body>

<div class="app">

<div class="sidebar">

<h2>PATPEN</h2>

<div id="steps"></div>

</div>

<div class="content">

<div id="success" class="success">
✅ Contribution enregistrée dans PATPEN.
</div>

<div id="error" class="error">
❌ Erreur pendant l'envoi.
</div>

<form id="f">

<!-- PAGE 1 -->

<div class="page active">

<h2>1. Localisation</h2>

<div id="map"></div>

<input id="lat" name="latitude" readonly>

<input id="lng" name="longitude" readonly>

<input
name="commune"
value="Pénestin">

<input
name="adresse"
placeholder="Adresse">

</div>

<!-- PAGE 2 -->

<div class="page">

<h2>2. Illustration</h2>

<input
type="file"
name="photos"
multiple>

<textarea
name="legende"
placeholder="Légende"></textarea>

<input
name="credit_photo"
placeholder="Crédit photo">

</div>

<!-- PAGE 3 -->

<div class="page">

<h2>3. Désignation</h2>

<select name="categorie">

<option>Puits</option>
<option>Fontaine</option>
<option>Lavoir</option>
<option>Four à pain</option>
<option>Croix</option>
<option>Calvaire</option>
<option>Moulin</option>
<option>Maison remarquable</option>
<option>Arbre remarquable</option>
<option>Autre</option>

</select>

<input
name="nom"
placeholder="Nom du patrimoine">

</div>

<!-- PAGE 4 -->

<div class="page">

<h2>4. Propriété</h2>

<input
name="proprietaire"
placeholder="Propriétaire">

<select name="acces">
<option>Libre</option>
<option>Restreint</option>
</select>

</div>

<!-- PAGE 5 -->

<div class="page">

<h2>5. Description</h2>

<textarea
name="description"
placeholder="Description"></textarea>

<input
name="materiaux"
placeholder="Matériaux">

</div>

<!-- PAGE 6 -->

<div class="page">

<h2>6. Historique</h2>

<input
name="periode"
placeholder="Période">

<textarea
name="historique"
placeholder="Historique"></textarea>

</div>

<!-- PAGE 7 -->

<div class="page">

<h2>7. Observations</h2>

<textarea
name="commentaires"
placeholder="Commentaires"></textarea>



<h3>Résumé :</h3>

<pre id="json"></pre>

<button
type="button"
id="sendBtn"
class="send-btn">

Envoyer la contribution

</button>




</div>

</form>

<div class="nav">



<button type="button" onclick="prev()">
Précédent
</button>


<button type="button" onclick="next()">
Suivant
</button>

</div>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbwQjb4mNhtIuKX6ma5k1aPBlXbDjjmH1yJRvP1Tu6aEZ1i-PpXca2fS0WdzDEJZCtR4cQ/exec";

    
const names=[
"Localisation",
"Illustration",
"Désignation",
"Propriété",
"Description",
"Historique",
"Observations"
];

let cur=0;

const pages=
document.querySelectorAll(".page");

const steps=
document.getElementById("steps");

function renderSteps(){

    steps.innerHTML="";

    names.forEach((n,i)=>{

        const d=
        document.createElement("div");

        d.className=
        i===cur
        ? "step active-step"
        : "step";

        d.textContent=
        (i+1)+". "+n;

        steps.appendChild(d);

    });

}






function show(){

    pages.forEach((p,i)=>{

        p.classList.toggle(
            "active",
            i===cur
        );

    });

    renderSteps();

    const nextBtn =
        document.querySelector(".nav button:last-child");









if(cur===6){

    nextBtn.textContent =
        "Ajouter une autre contribution";

    nextBtn.style.background =
        "#205ba4";

    const data =
    Object.fromEntries(
        new FormData(
            document.getElementById("f")
        )
    );








        document
        .getElementById("json")
        .textContent =
        JSON.stringify(
            data,
            null,
            2
        );

}else{

    nextBtn.textContent =
        "Suivant";

    nextBtn.style.background =
        "#009588";

    

}
}







function next(){

    if(cur < pages.length - 1){

        cur++;
        show();

    }else{

        document.getElementById("f").reset();

        document.getElementById("lat").value =
            "47.483000";

        document.getElementById("lng").value =
            "-2.480000";

        marker.setLatLng(
            [47.483,-2.48]
        );

        map.setView(
            [47.483,-2.48],
            14
        );

        cur = 0;

        show();

    }



}

function prev(){

    if(cur>0){

        cur--;
        show();

    }

}

renderSteps();

const map=
L.map("map")
.setView(
    [47.483,-2.48],
    14
);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
 attribution:'© OpenStreetMap'
}
).addTo(map);

let marker=
L.marker(
[47.483,-2.48]
).addTo(map);

document.getElementById("lat").value="47.483000";
document.getElementById("lng").value="-2.480000";

map.on("click",e=>{

    document.getElementById("lat").value=
    e.latlng.lat.toFixed(6);

    document.getElementById("lng").value=
    e.latlng.lng.toFixed(6);

    marker.setLatLng(e.latlng);

});

function fileToBase64(file){

    return new Promise((resolve,reject)=>{

        const reader =
            new FileReader();

        reader.onload = ()=>
            resolve(reader.result);

        reader.onerror = reject;

        reader.readAsDataURL(file);

    });

}





document
.getElementById("sendBtn")
.addEventListener(
"click",
async()=>{



const form =
document.getElementById("f");









const data =
Object.fromEntries(
    new FormData(form)
);

const fichier =
document.querySelector(
    'input[name="photos"]'
).files[0];

if(fichier){

    data.photo =
        await fileToBase64(
            fichier
        );

    delete data.photos;

}

console.log("PHOTO =", data.photo);
console.log("PHOTOS =", data.photos);

try{

    await fetch(
        WEBAPP_URL,
        {
            method:"POST",
            mode:"no-cors",
            body:JSON.stringify(data)
        }
    );

    document.getElementById("success")
    .style.display="block";

    document.getElementById("error")
    .style.display="none";

}
catch(error){

    console.error(error);

    document.getElementById("success")
    .style.display="none";

    document.getElementById("error")
    .style.display="block";

}








});

show();

</script>

</body>
</html>
