<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>PATPEN - Inventaire patrimonial</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet/dist/leaflet.css">

<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap"
rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:"Open Sans",sans-serif;
    background:#f5f2f8;
    color:#222;
}

/* ---------- Layout ---------- */

.wrapper{
    max-width:1400px;
    margin:auto;
    padding:20px;
    display:flex;
    gap:20px;
    align-items:flex-start;
}

.sidebar{
    width:260px;
    flex-shrink:0;

    background:#fff;
    border-radius:12px;
    padding:20px;

    position:sticky;
    top:20px;

    box-shadow:
    0 2px 12px rgba(0,0,0,.08);
}

.content{
    flex:1;
    display:flex;
    justify-content:center;
}

.card{

    width:100%;
    max-width:850px;

    background:#fff;
    border-radius:12px;

    padding:24px;

    box-shadow:
    0 2px 12px rgba(0,0,0,.08);

    overflow:hidden;
}

/* ---------- Etapes ---------- */

.step{
    padding:10px 12px;
    margin-bottom:8px;
    border-radius:8px;
    transition:0.2s;
}

.step.active{
    background:#f0e5ed;
    color:#9b4b82;
    font-weight:700;
}

/* ---------- Titres ---------- */

h2{
    margin-top:0;
}

/* ---------- Carte ---------- */

#map{
    height:400px;
    width:100%;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:15px;
}

/* ---------- Champs ---------- */

input,
select,
textarea{

    width:100%;

    padding:12px;

    margin-bottom:12px;

    border:1px solid #dadada;

    border-radius:8px;

    font-size:15px;

    font-family:inherit;
}

input:focus,
select:focus,
textarea:focus{

    outline:none;

    border-color:#9b4b82;

    box-shadow:
    0 0 0 3px rgba(155,75,130,.15);
}

textarea{
    min-height:120px;
    resize:vertical;
}

/* ---------- Pages ---------- */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* ---------- Boutons ---------- */

.buttons{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top:20px;
}

button{
    padding:12px 18px;
    border:none;
    border-radius:8px;

    background:#9b4b82;
    color:white;

    font-size:15px;

    cursor:pointer;
}

button:hover{
    background:#83406d;
}

/* ---------- JSON ---------- */

#json{
    background:#f5f5f5;
    padding:15px;
    border-radius:8px;
    overflow:auto;
}

/* ---------- Tablette ---------- */

@media (max-width:1024px){

    .wrapper{
        flex-direction:column;
    }

    .sidebar{
        width:100%;
        position:relative;
        top:auto;
    }

    .content{
        width:100%;
    }

}

/* ---------- Mobile ---------- */

@media (max-width:768px){

    body{
        background:white;
    }

    .wrapper{
        padding:10px;
        gap:10px;
    }

    .card{
        padding:16px;
    }

    #map{
        height:300px;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    input,
    textarea,
    select{
        font-size:16px;
    }
}

</style>

</head>

<body>

<div class="wrapper">

    <div class="sidebar">

        <h2>PATPEN</h2>

        <div id="steps"></div>

    </div>

    <div class="content">

        <div class="card">

            <form id="f">

                <!-- toutes tes pages ici -->

            </form>

            <div class="buttons">

                <button onclick="prev()" type="button">
                    Précédent
                </button>

                <button onclick="next()" type="button">
                    Suivant
                </button>

            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    },200);

}

</script>

</body>
</html>
