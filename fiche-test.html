<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Fiche patrimoine</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

:root{
    --patpen:#205BA4;
    --patpen-dark:#184781;
    --patpen-light:#EAF2FB;
    --texte:#333;
    --bordure:#D4E1F2;
}

body{
    margin:0;
    background:#F7FAFE;
    font-family:Segoe UI,sans-serif;
    color:var(--texte);
}

.header{
    background:#fff;
    padding:20px;
    border-bottom:1px solid var(--bordure);
}

.btn-retour{
    background:var(--patpen);
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    cursor:pointer;
}

h1{
    color:var(--patpen);
    margin:20px 0 10px;
}

.badge{
    display:inline-block;
    background:#E7F4EA;
    color:#217346;
    padding:8px 15px;
    border-radius:20px;
    font-weight:bold;
}

.galerie{
    padding:20px;
}

.galerie img{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:20px;
    background:#ddd;
}

.adresse{
    margin:20px;
    padding:20px;
    background:var(--patpen-light);
    border-radius:15px;
}

.btn-carte{
    display:inline-block;
    margin-top:15px;
    background:var(--patpen);
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
}

.section{
    background:white;
    padding:20px;
    border-top:1px solid var(--bordure);
}

.label{
    font-weight:bold;
    color:#666;
    margin-bottom:8px;
}

.valeur{
    line-height:1.6;
}

.meta{
    padding:20px;
    background:white;
}

#carte{
    height:400px;
}

</style>

</head>
<body>

<div class="header">

<button class="btn-retour"
onclick="window.location.href='index.html'">
